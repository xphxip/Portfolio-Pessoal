<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-rpg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#31104b"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-rpg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-rpg)"/>

  <!-- Pixel Grid Map Visual -->
  <g transform="translate(140, 50)">
    <rect x="0" y="0" width="520" height="300" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(168, 85, 247, 0.3)" stroke-width="2"/>
    
    <!-- Tiled Map Tiles -->
    <g fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1">
      <!-- Row 1 -->
      <rect x="20" y="20" width="75" height="75" rx="6"/>
      <rect x="100" y="20" width="75" height="75" rx="6" fill="rgba(16, 185, 129, 0.2)"/>
      <rect x="180" y="20" width="75" height="75" rx="6" fill="rgba(16, 185, 129, 0.2)"/>
      <rect x="260" y="20" width="75" height="75" rx="6"/>
      <rect x="340" y="20" width="75" height="75" rx="6" fill="rgba(59, 130, 246, 0.2)"/>
      <rect x="420" y="20" width="75" height="75" rx="6" fill="rgba(59, 130, 246, 0.2)"/>

      <!-- Row 2 -->
      <rect x="20" y="105" width="75" height="75" rx="6"/>
      <rect x="100" y="105" width="75" height="75" rx="6"/>
      <rect x="180" y="105" width="75" height="75" rx="6" fill="rgba(168, 85, 247, 0.25)"/> <!-- Character Tile -->
      <rect x="260" y="105" width="75" height="75" rx="6"/>
      <rect x="340" y="105" width="75" height="75" rx="6"/>
      <rect x="420" y="105" width="75" height="75" rx="6" fill="rgba(59, 130, 246, 0.2)"/>

      <!-- Row 3 -->
      <rect x="20" y="190" width="75" height="75" rx="6" fill="rgba(245, 158, 11, 0.2)"/>
      <rect x="100" y="190" width="75" height="75" rx="6" fill="rgba(245, 158, 11, 0.2)"/>
      <rect x="180" y="190" width="75" height="75" rx="6"/>
      <rect x="260" y="190" width="75" height="75" rx="6"/>
      <rect x="340" y="190" width="75" height="75" rx="6"/>
      <rect x="420" y="190" width="75" height="75" rx="6"/>
    </g>

    <!-- Hero Character Icon -->
    <circle cx="217" cy="142" r="22" fill="#a855f7" stroke="#ffffff" stroke-width="2"/>
    <text x="217" y="148" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">⚔️</text>

    <!-- Enemy Icon -->
    <circle cx="377" cy="142" r="18" fill="#ef4444" stroke="#ffffff" stroke-width="1.5"/>
    <text x="377" y="147" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle">👾</text>
  </g>

  <!-- Flutter & RPG Badge -->
  <rect x="260" y="360" width="280" height="36" rx="18" fill="url(#accent-rpg)"/>
  <text x="400" y="383" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PIRPG — Jogo RPG em Flutter</text>
</svg>
