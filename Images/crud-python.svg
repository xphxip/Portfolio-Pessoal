<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
  <path d="M100 0 V450 M200 0 V450 M300 0 V450 M400 0 V450 M500 0 V450 M600 0 V450 M700 0 V450" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Mock Window / Card -->
  <rect x="120" y="60" width="560" height="330" rx="16" fill="url(#card)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <!-- Window Header -->
  <rect x="120" y="60" width="560" height="40" rx="16" fill="rgba(0,0,0,0.3)"/>
  <circle cx="150" cy="80" r="6" fill="#ef4444"/>
  <circle cx="170" cy="80" r="6" fill="#f59e0b"/>
  <circle cx="190" cy="80" r="6" fill="#10b981"/>
  <text x="400" y="85" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" font-weight="500">app.py — Flask &amp; SQLAlchemy CRUD</text>

  <!-- Python Icon / Branding -->
  <g transform="translate(160, 130)">
    <!-- Code preview block -->
    <rect x="0" y="0" width="480" height="220" rx="8" fill="#090d16" stroke="rgba(255,255,255,0.05)"/>
    <text x="25" y="40" fill="#f472b6" font-family="monospace" font-size="14">from</text>
    <text x="70" y="40" fill="#e2e8f0" font-family="monospace" font-size="14">flask</text>
    <text x="120" y="40" fill="#f472b6" font-family="monospace" font-size="14">import</text>
    <text x="180" y="40" fill="#38bdf8" font-family="monospace" font-size="14">Flask, render_template, request</text>

    <text x="25" y="70" fill="#f472b6" font-family="monospace" font-size="14">from</text>
    <text x="70" y="70" fill="#e2e8f0" font-family="monospace" font-size="14">models</text>
    <text x="130" y="70" fill="#f472b6" font-family="monospace" font-size="14">import</text>
    <text x="190" y="70" fill="#38bdf8" font-family="monospace" font-size="14">db, User</text>

    <text x="25" y="110" fill="#818cf8" font-family="monospace" font-size="14">@app.route</text>
    <text x="115" y="110" fill="#4ade80" font-family="monospace" font-size="14">('/users/create'</text>
    <text x="260" y="110" fill="#e2e8f0" font-family="monospace" font-size="14">, methods=[</text>
    <text x="355" y="110" fill="#4ade80" font-family="monospace" font-size="14">'POST'</text>
    <text x="410" y="110" fill="#e2e8f0" font-family="monospace" font-size="14">])</text>

    <text x="25" y="140" fill="#f472b6" font-family="monospace" font-size="14">def</text>
    <text x="60" y="140" fill="#fbbf24" font-family="monospace" font-size="14">create_user</text>
    <text x="160" y="140" fill="#e2e8f0" font-family="monospace" font-size="14">():</text>

    <text x="55" y="170" fill="#e2e8f0" font-family="monospace" font-size="14">user = User(name=request.form[</text>
    <text x="310" y="170" fill="#4ade80" font-family="monospace" font-size="14">'name'</text>
    <text x="360" y="170" fill="#e2e8f0" font-family="monospace" font-size="14">])</text>

    <text x="55" y="195" fill="#38bdf8" font-family="monospace" font-size="14">db.session.add</text>
    <text x="180" y="195" fill="#e2e8f0" font-family="monospace" font-size="14">(user); </text>
    <text x="240" y="195" fill="#38bdf8" font-family="monospace" font-size="14">db.session.commit</text>
    <text x="390" y="195" fill="#e2e8f0" font-family="monospace" font-size="14">()</text>
  </g>

  <!-- Title Badge -->
  <rect x="250" y="365" width="300" height="36" rx="18" fill="url(#accent)"/>
  <text x="400" y="388" fill="#0f172a" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">CRUD Python + Flask + SQLAlchemy</text>
</svg>
