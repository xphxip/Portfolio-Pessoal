<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-fin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent-fin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-fin)"/>
  
  <!-- Subtle Grid -->
  <path d="M0 60 H800 M0 120 H800 M0 180 H800 M0 240 H800 M0 300 H800 M0 360 H800" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Main App Card -->
  <rect x="120" y="50" width="560" height="340" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(52, 211, 153, 0.2)" stroke-width="1.5"/>

  <!-- Top Stats Row -->
  <g transform="translate(150, 80)">
    <!-- Balance Card -->
    <rect x="0" y="0" width="150" height="70" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="15" y="25" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Saldo Total</text>
    <text x="15" y="52" fill="#34d399" font-family="system-ui, sans-serif" font-size="18" font-weight="700">R$ 12.450,00</text>

    <!-- Income Card -->
    <rect x="175" y="0" width="150" height="70" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="190" y="25" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Receitas</text>
    <text x="190" y="52" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="18" font-weight="700">+ R$ 5.200,00</text>

    <!-- Expenses Card -->
    <rect x="350" y="0" width="150" height="70" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="365" y="25" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">Despesas</text>
    <text x="365" y="52" fill="#f87171" font-family="system-ui, sans-serif" font-size="18" font-weight="700">- R$ 1.850,00</text>
  </g>

  <!-- Financial Chart Visual -->
  <g transform="translate(150, 180)">
    <rect x="0" y="0" width="500" height="140" rx="10" fill="rgba(0,0,0,0.3)" stroke="rgba(255,255,255,0.05)"/>
    <!-- Bars -->
    <rect x="40" y="60" width="30" height="60" rx="4" fill="#34d399"/>
    <rect x="100" y="40" width="30" height="80" rx="4" fill="#60a5fa"/>
    <rect x="160" y="80" width="30" height="40" rx="4" fill="#f87171"/>
    <rect x="220" y="30" width="30" height="90" rx="4" fill="#34d399"/>
    <rect x="280" y="50" width="30" height="70" rx="4" fill="#60a5fa"/>
    <rect x="340" y="20" width="30" height="100" rx="4" fill="#34d399"/>
    <rect x="400" y="45" width="30" height="75" rx="4" fill="#a78bfa"/>

    <!-- Trend Line -->
    <path d="M 55 60 L 115 40 L 175 80 L 235 30 L 295 50 L 355 20 L 415 45" fill="none" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Title Badge -->
  <rect x="260" y="360" width="280" height="36" rx="18" fill="url(#accent-fin)"/>
  <text x="400" y="383" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Controlador Financeiro Web</text>
</svg>
